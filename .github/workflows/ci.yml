name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, test, build and verify plugin structure
        run: ./gradlew ktlintCheck test buildPlugin verifyPluginStructure --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LocalizedLauncherIcon-plugin
          path: build/distributions/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # only the release job may create releases
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalizedLauncherIcon-plugin

      - name: Attach ZIP to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
